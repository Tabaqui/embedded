[package]
name = "stm32g030"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-futures = "0.1.2"
embassy-stm32 = { version = "0.6.0", features = ["stm32g030f6", "defmt", "time-driver-tim3"] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.0", features = ["defmt", "defmt-timestamp-uptime"] }
# , features = [ "defmt", "time-driver-any", "stm32g030f6", "memory-x", "unstable-pac", "exti"] }
# embassy-executor = { version = "0.9.0", features = ["arch-cortex-m", "executor-thread", "defmt"] }
# panic-halt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
# stm32g0xx-hal = { version = "0.2.0", features = ["stm32g030"] }
# embedded-hal = "0.2.6"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
